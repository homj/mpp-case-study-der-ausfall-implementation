services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ausfall
      POSTGRES_PASSWORD: ausfall
      POSTGRES_DB: ausfall
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ausfall -d ausfall']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://ausfall:ausfall@db:5432/ausfall
      # Fixed demo clock: the case study plays on 7 September 2026.
      APP_NOW: '2026-09-07T07:40:00+02:00'
      DATA_DIR: /app/data
      PORT: '4000'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4000:4000'

  # TODO slice 3: web (TanStack Start + shadcn/ui, react-i18next with de as the
  # default locale). It will build from apps/web/Dockerfile, depend on api, and
  # publish port 3000.
  # web:
  #   build:
  #     context: .
  #     dockerfile: apps/web/Dockerfile
  #   environment:
  #     API_URL: http://api:4000
  #   depends_on:
  #     - api
  #   ports:
  #     - '3000:3000'

volumes:
  db-data:
